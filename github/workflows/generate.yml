name: Auto Generate PDFs
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install fpdf2 qrcode[pil] pandas
      - run: python generate.py
      - uses: actions/upload-artifact@v4
        with:
          name: generated-pdfs
          path: output/
